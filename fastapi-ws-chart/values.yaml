replicaCount: 3

image:
  repository: myrepo/fastapi-ws
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

env: []
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

websocket:
  enabled: true
  path: /ws

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: fastapi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
