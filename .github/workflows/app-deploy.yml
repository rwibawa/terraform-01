# .github/workflows/app-deploy.yml
name: FastAPI EKS Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t ${{ env.ECR_REPO }}:${IMAGE_TAG} .
          docker push ${{ env.ECR_REPO }}:${IMAGE_TAG}
    env:
      ECR_REPO: ${{ secrets.ECR_REPO }}

  deploy-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Get EKS kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy Helm
        run: |
          helm upgrade --install fastapi-ws ./fastapi-ws-chart \
            --namespace app --create-namespace \
            --set image.repository=${{ secrets.ECR_REPO }} \
            --set image.tag=${GITHUB_SHA}
